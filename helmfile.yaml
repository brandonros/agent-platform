---
repositories:
  - name: bjw-s-labs
    url: ghcr.io/bjw-s-labs/helm
    oci: true

helmDefaults:
  wait: true
  waitForJobs: true
  timeout: 900
  createNamespace: true
  atomic: false

releases:
  - name: code-server
    namespace: agent-platform
    chart: bjw-s-labs/app-template
    version: 5.1.0
    values:
      - values/code-server.yaml.gotmpl

  # Entra ID sign-in in front of code-server.
  - name: oauth2-proxy
    namespace: agent-platform
    chart: bjw-s-labs/app-template
    version: 5.1.0
    values:
      - values/oauth2-proxy.yaml.gotmpl
    needs:
      - agent-platform/code-server

  # Job template for Claude Code turns; session directories share the existing PVC.
  - name: claude-job
    namespace: agent-platform
    chart: bjw-s-labs/app-template
    version: 5.1.0
    values:
      - values/claude-job.yaml.gotmpl
    needs:
      - agent-platform/code-server

  - name: mcp-test-server
    namespace: agent-platform
    chart: bjw-s-labs/app-template
    version: 5.1.0
    values:
      - values/mcp-test-server.yaml.gotmpl
