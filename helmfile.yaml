---
repositories:
  - name: bjw-s-labs
    url: ghcr.io/bjw-s-labs/helm
    oci: true

helmDefaults:
  wait: true
  waitForJobs: true
  timeout: 900
  createNamespace: true
  atomic: false

releases:
  # One browser IDE per user in users.yaml (values read the user from the release name).
  - name: code-server-brandon
    namespace: agent-platform
    chart: bjw-s-labs/app-template
    version: 5.1.0
    values:
      - values/code-server.yaml.gotmpl

  # Entra ID sign-in in front of code-server.
  - name: oauth2-proxy
    namespace: agent-platform
    chart: bjw-s-labs/app-template
    version: 5.1.0
    values:
      - values/oauth2-proxy.yaml.gotmpl

  # Job template for Claude Code turns; the dispatcher points it at a user's PVC.
  - name: claude-job
    namespace: agent-platform
    chart: bjw-s-labs/app-template
    version: 5.1.0
    values:
      - values/claude-job.yaml.gotmpl

  - name: mcp-test-server
    namespace: agent-platform
    chart: bjw-s-labs/app-template
    version: 5.1.0
    values:
      - values/mcp-test-server.yaml.gotmpl
