defaultPodOptions:
  securityContext:
    fsGroup: 1000
controllers:
  temporal-dev-server:
    forceRename: temporal-dev-server
    # One pod owns the ReadWriteOnce SQLite volume.
    strategy: Recreate
    containers:
      app:
        image:
          repository: temporalio/temporal
          tag: "1.9.1"
        # Single-process dev server: frontend, history, matching, and UI with
        # SQLite storage. No Postgres or clustering; fine for one VM.
        command:
          - temporal
          - server
          - start-dev
          - --ip=0.0.0.0
          - --db-filename=/data/temporal.db
        probes:
          startup:
            custom: true
            enabled: true
            spec:
              failureThreshold: 30
              tcpSocket:
                port: 7233
              periodSeconds: 2
          readiness:
            custom: true
            enabled: true
            spec:
              tcpSocket:
                port: 7233
              periodSeconds: 15
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
    replicas: 1
persistence:
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /data
service:
  temporal-dev-server:
    controller: temporal-dev-server
    forceRename: temporal-dev-server
    ports:
      grpc:
        port: 7233
        targetPort: 7233
        appProtocol: kubernetes.io/h2c
      ui:
        port: 8233
        targetPort: 8233
ingress:
  temporal-dev-server:
    className: traefik
    forceRename: temporal-dev-server
    hosts:
      - host: temporal.127.0.0.1.sslip.io
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: temporal-dev-server
              port: ui
